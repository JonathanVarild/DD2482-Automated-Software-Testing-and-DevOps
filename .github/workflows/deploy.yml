name: Deploy production

# Run the action when we push to main and also allow it to be ran manually.
on:
  push:
    branches:
      - main

# Allow workflow to read repo, push packages to GHCR, and read pull requests
permissions:
  contents: read
  packages: write
  pull-requests: read

# Ensure that only one Terraform job runs at a time
concurrency:
  group: terraform-vps
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      # Set Terraform to run in automation mode and disable interactive prompts.
      TF_IN_AUTOMATION: true
      TF_INPUT: false

      # Terraform Cloud token for authentication
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_WORKSPACE: devops-production

      # Additional Terraform variables
      TF_VAR_environment: production

      # Application-specific environment variables
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_session_secret: ${{ secrets.SESSION_SECRET }}
      TF_VAR_hostname: devops.jompecloud.com
      TF_VAR_proxy_network: dd2482-proxy

    steps:
      # Check out the repo so we can use the Terraform configs.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instantiate Terraform CLI for use in the workflow
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # Save the SSH key to file so it can be used for connectivity.
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H 92.222.25.69 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Check basic connectivity and that we can interface with Docker.
      - name: Test VPS connection
        run: ssh deploy@92.222.25.69 'docker info >/dev/null'

      # Authenticate with GitHub Container Registry so we cna push Docker images.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Find the merged PR associated with this push to main.
      - name: Find merged PR
        id: merged_pr
        if: github.event.forced == false
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: context.sha,
            });

            const mergedPullRequest = pullRequests.find(
              ({ merged_at, base, merge_commit_sha }) =>
                merged_at &&
                base.ref === "main" &&
                merge_commit_sha === context.sha,
            );

            core.setOutput("head_sha", mergedPullRequest?.head.sha ?? "");

      # Use the PR head SHA when available, otherwise use the current main SHA.
      - name: Select production images
        shell: bash
        env:
          PR_HEAD_SHA: ${{ steps.merged_pr.outputs.head_sha }}
        run: |
          IMAGE_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "APP_IMAGE=$IMAGE_REPOSITORY:$IMAGE_SHA" >> "$GITHUB_ENV"
          echo "DATABASE_IMAGE=$IMAGE_REPOSITORY-database:$IMAGE_SHA" >> "$GITHUB_ENV"

      # Fail rather than rebuilding if the merged PR images are unexpectedly missing.
      - name: Verify merged PR images
        if: steps.merged_pr.outputs.head_sha != ''
        run: |
          for image in "$APP_IMAGE" "$DATABASE_IMAGE"; do
              docker manifest inspect "$image" >/dev/null || {
                  echo "::error::Expected image does not exist: $image"
                  exit 1
              }
          done

      # Build the app and database Docker images.
      - name: Build fresh images
        if: steps.merged_pr.outputs.head_sha == ''
        run: |
          docker build -t "$APP_IMAGE" .
          docker build -t "$DATABASE_IMAGE" database

      # Upload the images to GitHub Container Registry so they can be pulled by the VPS.
      - name: Push fresh images
        if: steps.merged_pr.outputs.head_sha == ''
        run: |
          docker push "$APP_IMAGE"
          docker push "$DATABASE_IMAGE"

      # Initalize the Terraform working directory and download provider plugins.
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      # Verify the Terraform lock file and ensure that the lockfile is up to date.
      # This prevents the workflow from running if a change has been made
      # to the Terraform configuration without updating the lockfile.
      - name: Verify Terraform lock file
        run: |
          if ! git diff --exit-code -- terraform/.terraform.lock.hcl; then
          echo "::error::.terraform.lock.hcl is out of date."
          exit 1
          fi

      # Plan the Terraform configuration, output the plan so it can be used in apply step,
      # and set a lock timeout to prevent simultaneous runs from interfering with each other.
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_app_image: ${{ env.APP_IMAGE }}
          TF_VAR_database_image: ${{ env.DATABASE_IMAGE }}
        run: terraform plan -lock-timeout=10m -out=tfplan

      # Apply the Terraform configuration to the VPS.
      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_app_image: ${{ env.APP_IMAGE }}
          TF_VAR_database_image: ${{ env.DATABASE_IMAGE }}
        run: terraform apply -auto-approve tfplan

  # Run the End-to-End tests after deployment to ensure the deployed application is functioning correctly.
  e2e:
    name: E2E tests
    needs: deploy
    uses: ./.github/workflows/e2e.yml
    with:
      preview_url: https://devops.jompecloud.com
      head_sha: ${{ github.sha }}
