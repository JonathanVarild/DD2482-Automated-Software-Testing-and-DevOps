name: Continuous integration

# Run CI on every push.
on:
  push:

# Allow workflow to read repo contents.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      # Check out the repo so we can run the tests.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Instantiate Node.js for use in the workflow
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Install the dependencies needed to run the tests.
      - name: Install dependencies
        run: npm ci

      # Run linting to check for code style issues.
      - name: Lint
        run: npm run lint

      # Run Prettier formatting check to ensure code is formatted correctly.
      - name: Check formatting
        run: npm run format:check

      # Run type checking to ensure TypeScript types are valid.
      - name: Type check
        run: npm run typecheck

      # Run tests to ensure the code behaves as expected.
      - name: Unit tests
        run: npm run test:unit
