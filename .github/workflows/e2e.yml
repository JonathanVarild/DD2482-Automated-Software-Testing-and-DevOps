name: E2E tests

# Make this workflow callable from other workflows and require the deployment URL and head SHA as inputs.
on:
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      head_sha:
        required: true
        type: string

# Allow workflow to read repo contents.
permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}

    steps:
      # Smoke test the deployment by waiting until it is reachable.
      - name: Check deployment
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$PLAYWRIGHT_BASE_URL/en" >/dev/null

  e2e:
    name: E2E tests
    needs: smoke
    runs-on: ubuntu-latest

    # Set up environment variable for the URL that the tests should run against.
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}

    steps:
      # Check out the code used by the deployment.
      - name: Checkout deployed code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}

      # Set up Node.js environment for running the E2E tests.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install project dependencies.
      - name: Install dependencies
        run: npm ci

      # Install Chromium for Playwright tests.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Run E2E tests against the deployment.
      - name: E2E tests
        run: npm run test:e2e
